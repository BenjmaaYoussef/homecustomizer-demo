    <!-- the LCP image: the building's hero frame (04 = building.json turntable.hero; phones take 960,
         or 1280 at 3x, as building.ts turnWidth() does), or the living room for customizer links -->
    <script>
      (function () {
        var q = location.search, l = document.createElement("link");
        var room = /[?&]v=(room|overview)/.test(q) || (/[?&](c|r)=/.test(q) && !/[?&]v=/.test(q));
        var phone = matchMedia("(max-width: 600px), (max-height: 560px)").matches;
        var w = phone ? ((window.devicePixelRatio || 1) > 2 ? 1280 : 960) : 1920;
        l.rel = "preload"; l.as = "image"; l.setAttribute("fetchpriority", "high");
        l.href = room ? "assets/living/base.1920.webp" : "assets/building/turn/04." + w + ".webp";
        document.head.appendChild(l);
      })();
    </script>
